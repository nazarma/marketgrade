name: CI

# Manual runs only, from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Marketgrade.slnx
      - run: dotnet build Marketgrade.slnx --no-restore
      - run: dotnet test --solution Marketgrade.slnx --no-build
      - run: dotnet format Marketgrade.slnx --verify-no-changes --no-restore

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir src/ui lint
      - run: pnpm --dir src/ui format:check
      - run: pnpm --dir src/ui test
      - run: pnpm --dir src/ui build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop
      - run: cargo check --locked
        working-directory: src/desktop
